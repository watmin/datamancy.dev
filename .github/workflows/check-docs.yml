# Drift gate: the generated docs (grimoire index + README catalog) must match
# what the spell frontmatter regenerates. A hand-edited table, or a spell whose
# frontmatter changed without a regen, fails here — so the README claim "edit
# the spell, not the table" is enforced by the build, not by vigilance.
name: check-docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # the warding-ledger gate resolves each row's stamp commit; a depth-1
          # clone cannot see them and the gate refuses to guess.
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      # No dependencies to install — the generators are zero-dep Node scripts.
      - run: npm run check:docs
      # `functions/_middleware.js` decides whether every published spell URL
      # resolves; its tests existed and nothing ran them.
      - run: npm test
      # On a PUSHED commit the signed manifest must describe the tree, or the
      # site serves a 404 for a spell the indexes advertise and the adapter
      # refuses files on hash mismatch. Not in check:docs: a working tree
      # mid-authoring is legitimately ahead of the manifest.
      #
      # `push` ONLY. A PR branch is mid-authoring by definition, and it cannot be
      # made green: signing is deliberately human-gated and must never run in CI
      # (see CONTRIBUTING, "Trust — why signing is manual"). Without this guard the
      # step is permanently red on every PR touching a spell — which is exactly the
      # ignore-the-gate failure the gate's own docblock exists to avoid.
      - if: github.event_name == 'push'
        run: npm run manifest:check
